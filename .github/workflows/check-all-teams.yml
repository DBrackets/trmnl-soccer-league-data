name: Compare all repository teams with ESPN

on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Confederation folder to check (e.g. uefa, conmebol)"
        required: true
        default: "uefa"
        type: string
      compare_names:
        description: "Fail if matching IDs have different team names"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  compare-all-teams:
    name: Compare all league files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compare all league files
        run: |
          python scripts/check_all_teams.py \
            --directory "${{ inputs.directory }}" \
            --compare-names "${{ inputs.compare_names }}" \
            --exclude package.json \
            --exclude package-lock.json

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: all-team-comparison-report-${{ inputs.directory }}
          path: all-team-comparison-report.md
          if-no-files-found: warn
          retention-days: 30
